<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chiang Mai Trip 2026</title>
  <meta name="theme-color" content="#14532D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CM Trip">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__row">
      <div class="topbar__title">
        <h1 id="trip-title">Chiang Mai Trip</h1>
        <p id="trip-dates" class="topbar__dates"></p>
      </div>
      <div class="lang">
        <label id="lang-label" class="visually-hidden" for="lang-select">Language</label>
        <select id="lang-select" class="lang__select"></select>
      </div>
    </div>
    <nav id="day-tabs" class="tabs" aria-label="Days"></nav>
  </header>

  <main id="day-view" class="day-view" aria-live="polite">
    <p id="loading" class="loading">Loading…</p>
  </main>

  <footer class="footer">
    <p id="footer-note"></p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
